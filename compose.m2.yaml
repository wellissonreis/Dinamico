name: dinamico-m2
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dinamico
      POSTGRES_PASSWORD: ${DINAMICO_POSTGRES_PASSWORD:-dinamico-local-m2}
      POSTGRES_DB: dinamico_m2
    ports:
      - "127.0.0.1:${DINAMICO_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-m2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinamico -d dinamico_m2"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres-m2:
