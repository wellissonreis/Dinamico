name: dinamico-telemetry

# Optional, disposable local traces. Independent of compose.m2.yaml/PostgreSQL.
services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.16.0
    command: ["--config", "/etc/jaeger/local.yaml"]
    configs:
      - source: jaeger-local
        target: /etc/jaeger/local.yaml
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:13133:13133"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

configs:
  jaeger-local:
    content: |
      extensions:
        healthcheckv2:
          use_v2: true
          http:
            endpoint: 0.0.0.0:13133
        jaeger_query:
          storage:
            traces: local
          http:
            endpoint: 0.0.0.0:16686
        jaeger_storage:
          backends:
            local:
              memory:
                max_traces: 2000
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 384
          spike_limit_mib: 64
        batch:
          timeout: 1s
          send_batch_size: 128
          send_batch_max_size: 128
      exporters:
        jaeger_storage_exporter:
          trace_storage: local
      service:
        extensions: [healthcheckv2, jaeger_query, jaeger_storage]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [jaeger_storage_exporter]
