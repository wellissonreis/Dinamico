model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"

[agents.arquiteto]
description = "Análise de arquitetura, dependências e decisões técnicas delimitadas."
config_file = "agents/arquiteto.toml"

[agents.implementador]
description = "Implementação e correção de código no escopo delegado."
config_file = "agents/implementador.toml"

[agents.executor]
description = "Execução de testes, builds e verificações com diagnóstico objetivo."
config_file = "agents/executor.toml"
